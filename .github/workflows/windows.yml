name: Windows desktop

on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'installer/**', '.github/workflows/windows.yml']
  pull_request:
    branches: [main]
    paths: ['src/**', 'tests/**', 'installer/**', '.github/workflows/windows.yml']
  workflow_dispatch:
    inputs:
      package_installer:
        description: Build and test the final installer
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained Windows x64 build
        run: dotnet publish src/TheShop.Desktop -c Release -r win-x64 --self-contained true -o publish
      - name: Test editor calculation and file round trip
        run: dotnet run --project tests/TheShop.Desktop.Smoke -c Release
      - name: Build installer
        if: github.event_name == 'workflow_dispatch' && inputs.package_installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          & $compiler 'installer/TheShop.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup exited with code $LASTEXITCODE." }
      - name: Test installer, installed startup, and uninstall
        if: github.event_name == 'workflow_dispatch' && inputs.package_installer
        shell: pwsh
        run: ./installer/Test-InstalledShop.ps1 -Installer installer-output/The-Shop-Setup-x64.exe
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.package_installer
        with:
          name: The-Shop-Windows-x64
          path: installer-output/The-Shop-Setup-x64.exe
          if-no-files-found: error
