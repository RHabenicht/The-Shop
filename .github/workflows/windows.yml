name: Windows desktop

on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'installer/**', '.github/workflows/windows.yml']
  pull_request:
    branches: [main]
    paths: ['src/**', 'tests/**', 'installer/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained Windows x64 build
        run: dotnet publish src/TheShop.Desktop -c Release -r win-x64 --self-contained true -o publish
      - name: Check printed rules and invalid combinations
        run: dotnet run --project tests/TheShop.Rules.Audit -c Release
      - name: Test editor calculation and file round trip
        run: dotnet run --project tests/TheShop.Desktop.Smoke -c Release
      - name: Build installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          & $compiler 'installer/TheShop.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup exited with code $LASTEXITCODE." }
      - name: Test installation, installed startup, repair, and uninstall
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/TheShop.Desktop/TheShop.Desktop.vbproj -Raw)).Project.PropertyGroup.Version
          ./installer/Test-InstalledShop.ps1 -Installer installer-output/The-Shop-Setup-x64.exe -ExpectedVersion $version -Report installer-output/Installer-Test-Report.txt
      - name: Prepare download package
        shell: pwsh
        run: |
          Copy-Item installer/INSTALL.txt installer-output/INSTALL.txt
          $hash = (Get-FileHash installer-output/The-Shop-Setup-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content installer-output/SHA256SUMS.txt "$hash  The-Shop-Setup-x64.exe" -Encoding ascii
      - name: Upload tested installer
        uses: actions/upload-artifact@v4
        with:
          name: The-Shop-Windows-x64
          path: |
            installer-output/The-Shop-Setup-x64.exe
            installer-output/INSTALL.txt
            installer-output/Installer-Test-Report.txt
            installer-output/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload installer diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: The-Shop-Installer-Diagnostics
          path: installer-output/*.log
          if-no-files-found: ignore
